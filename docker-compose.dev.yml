version: '3.8'

services:
  # PostgreSQL Database for Development
  db-dev:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: shuttle_booking_dev
      POSTGRES_USER: shuttle_user
      POSTGRES_PASSWORD: dev_password_local
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"  # Use different port to avoid conflicts with production
    networks:
      - shuttle_network_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shuttle_user -d shuttle_booking_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tjoeftjaf.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - shuttle_network_dev
    depends_on:
      db-dev:
        condition: service_healthy

volumes:
  postgres_dev_data:
  pgadmin_data:

networks:
  shuttle_network_dev:
    driver: bridge